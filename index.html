<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Serviços do Veículo</title>

<!-- PWA: permite "Adicionar à tela inicial" e abrir em tela cheia -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Serviços">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">

<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e4e9;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2f6fed;
    --accent-soft: #eaf1ff;
    --warn: #d97706;
    --warn-soft: #fef3e2;
    --danger: #dc2626;
    --danger-soft: #fdeaea;
    --ok: #16a34a;
    --ok-soft: #e7f7ee;
    /* cores por tipo de veículo — trocadas em --accent/--accent-soft via JS
       quando o usuário troca de aba, pra dar identidade visual a cada um */
    --accent-carro: #2f6fed;
    --accent-carro-soft: #eaf1ff;
    --accent-moto: #e2711d;
    --accent-moto-soft: #fdf0e4;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c;
      --card: #1c1f27;
      --border: #2b2f3a;
      --text: #eef0f4;
      --muted: #9aa0ac;
      --accent: #5b8dff;
      --accent-soft: #1c2740;
      --warn: #f0a93d;
      --warn-soft: #3a2c12;
      --danger: #f36868;
      --danger-soft: #3a1c1c;
      --ok: #4ade80;
      --ok-soft: #123522;
      --accent-carro: #5b8dff;
      --accent-carro-soft: #1c2740;
      --accent-moto: #ff9d52;
      --accent-moto-soft: #3a2712;
    }
    .card-parts { background: #232631 !important; }
    .skeleton-card::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent); }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    padding-bottom: 100px;
  }

  /* Barra de carregamento (fica visível durante chamadas à API) */
  .loading-bar {
    position: fixed; top: 0; left: 0; height: 3px; width: 0%;
    background: var(--accent); z-index: 50; opacity: 0;
    transition: width 0.4s ease, opacity 0.2s ease;
  }
  .loading-bar.active { opacity: 1; width: 70%; }

  /* Header */
  .app-header { padding: 18px 16px 10px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .app-title { font-size: 19px; font-weight: 700; margin: 0 0 12px; }
  .tabs { display: flex; gap: 4px; background: #e7e9ee; border-radius: 10px; padding: 3px; }
  @media (prefers-color-scheme: dark) { .tabs { background: #23262f; } }
  .tab { flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border: none; background: none; position: relative; }
  .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .tab.active::after {
    content: ""; position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%);
    width: 16px; height: 3px; border-radius: 2px; background: var(--accent);
  }
  .vehicle-info {
    display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap;
    padding: 8px 4px 0; font-size: 12px; color: var(--muted); text-align: center;
  }
  .vehicle-info .add-part-link { font-size: 12px; }

  /* Summary */
  .summary { display: flex; gap: 8px; padding: 12px 16px 4px; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
  .stat-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .stat-value { font-size: 15px; font-weight: 700; }
  .edit-km-btn { border: none; background: none; cursor: pointer; font-size: 11px; padding: 0 0 0 2px; vertical-align: middle; opacity: 0.6; }
  .edit-km-btn:hover { opacity: 1; }

  /* Lembretes de manutenção (podem ser vários, um por tipo de serviço recorrente) */
  .lembrete { display: none; flex-direction: column; gap: 6px; margin: 8px 16px 0; }
  .lembrete-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-radius: 12px; font-size: 12.5px; font-weight: 600; line-height: 1.4;
  }
  .lembrete-icon { font-size: 15px; }
  .lembrete-ok { background: var(--ok-soft); color: var(--ok); }
  .lembrete-warn { background: var(--warn-soft); color: var(--warn); }
  .lembrete-danger { background: var(--danger-soft); color: var(--danger); }

  /* Gráfico de gasto por mês */
  .chart-block { display: none; margin: 8px 16px 0; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .chart-title { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 10px; }
  .chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 70px; }
  .chart-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; flex: 1; min-width: 0; }
  .chart-bar-wrap { flex: 1; display: flex; align-items: flex-end; width: 100%; }
  .chart-bar { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 3px; transition: height 0.3s ease; }
  .chart-label { font-size: 9.5px; color: var(--muted); margin-top: 4px; text-transform: uppercase; }
  .chart-value { font-size: 8.5px; color: var(--muted); margin-bottom: 2px; white-space: nowrap; }

  /* Search */
  .search-row { padding: 10px 16px 4px; display: flex; gap: 8px; }
  .search-box { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .search-box input { border: none; outline: none; font-size: 13px; flex: 1; background: none; color: var(--text); }
  .export-btn {
    flex-shrink: 0; width: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); font-size: 16px; cursor: pointer; color: var(--text);
  }

  /* Filtro por período */
  .filter-row { display: flex; gap: 6px; padding: 8px 16px 0; flex-wrap: wrap; }
  .filter-chip {
    font-size: 11.5px; font-weight: 600; padding: 6px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer;
  }
  .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* List */
  .list { padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .empty-state { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; cursor: pointer; transition: background 0.15s ease; }
  .card:active { background: var(--accent-soft); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-service { font-size: 14px; font-weight: 700; margin: 0 0 3px; }
  .card-meta { font-size: 12px; color: var(--muted); }
  .card-price { font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .card-obs { margin-top: 6px; font-size: 12px; color: var(--muted); font-style: italic; }
  .card-parts { margin-top: 8px; font-size: 12px; color: var(--muted); background: #f7f8fa; border-radius: 8px; padding: 6px 8px; }
  .btn-mini { font-size: 11.5px; font-weight: 600; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
  .btn-mini.danger { color: var(--danger); border-color: #f3c9c9; }
  @media (prefers-color-scheme: dark) { .btn-mini.danger { border-color: #5a2626; } }
  .badge-warn { display: inline-block; font-size: 10px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 2px 6px; margin-left: 6px; vertical-align: middle; }

  /* Skeleton (carregamento inicial) */
  .skeleton-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; height: 70px; position: relative; overflow: hidden; }
  .skeleton-card::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.05), transparent);
    animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  /* FAB */
  .fab {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(calc(-50% + 200px));
    width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 26px; border: none; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 18px rgba(47,111,237,0.4); cursor: pointer; z-index: 10;
  }
  @media (max-width: 480px) { .fab { transform: none; right: 20px; left: auto; } }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(15,17,23,0.45); display: none;
    align-items: flex-end; justify-content: center; z-index: 20;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding-bottom: 24px;
  }
  .modal-header { padding: 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border); }
  .modal-title { font-size: 16px; font-weight: 700; margin: 0; flex: 1; }
  .close-btn { font-size: 20px; color: var(--muted); background: none; border: none; cursor: pointer; }
  .modal-body { padding: 14px 16px 0; display: flex; flex-direction: column; gap: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font-size: 14px; color: var(--text); background: var(--card); font-family: inherit;
  }
  .row-2 { display: flex; gap: 10px; }
  .row-2 .field { flex: 1; }
  .parts-block { border: 1px dashed var(--border); border-radius: 12px; padding: 10px; }
  .parts-block-title { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .part-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .part-row input:first-child { flex: 2; }
  .part-row input:last-child { flex: 1; }
  .part-row .remove-part { background: none; border: none; color: var(--danger); font-size: 16px; cursor: pointer; padding: 0 4px; }
  .add-part-link { font-size: 12.5px; font-weight: 600; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; }
  .save-btn {
    margin-top: 4px; background: var(--accent); color: #fff; border: none; border-radius: 12px;
    padding: 13px; font-size: 14.5px; font-weight: 700; text-align: center; cursor: pointer; width: 100%;
  }
  .save-btn:disabled { opacity: 0.6; }
  .btn-row-2 { display: flex; gap: 10px; }
  .btn-row-2 .btn-mini { flex: 1; padding: 11px; font-size: 13px; }

  /* Modal de detalhes do serviço */
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .detail-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .detail-value { font-size: 14px; font-weight: 600; }
  .detail-price { color: var(--accent); font-size: 17px; }
  .detail-section { border-top: 1px solid var(--border); padding-top: 12px; }
  .detail-peca-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
  .detail-peca-row:last-child { border-bottom: none; }
  .detail-empty { font-size: 12.5px; color: var(--muted); }
  .detail-obs { font-size: 13px; color: var(--text); line-height: 1.5; white-space: pre-wrap; }

  .config-warning {
    margin: 16px; padding: 12px 14px; background: var(--danger-soft); border: 1px solid #f3c9c9;
    border-radius: 12px; font-size: 12.5px; color: #7a1f1f; line-height: 1.5;
  }
  .config-warning code { background: rgba(0,0,0,0.06); padding: 1px 4px; border-radius: 4px; }

  /* Toast (substitui alert() pra erros/avisos) */
  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(16px);
    background: #1f2430; color: #fff; font-size: 13px; font-weight: 600; padding: 10px 16px;
    border-radius: 10px; opacity: 0; pointer-events: none; transition: all 0.25s ease;
    z-index: 60; max-width: 88%; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.28);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }
</style>
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>

<div class="app">
  <div id="configWarning" class="config-warning" style="display:none">
    Configure a URL do seu Worker no início do arquivo <code>app.html</code>
    (constante <code>API_BASE_URL</code>) antes de usar.
  </div>

  <div class="app-header">
    <p class="app-title">Serviços do Veículo</p>
    <div class="tabs" id="tabs"></div>
    <div class="vehicle-info" id="vehicleInfo"></div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="lembrete" id="lembreteWrap"></div>
  <div class="chart-block" id="chartWrap"></div>

  <div class="search-row">
    <div class="search-box">
      🔎 <input type="text" id="searchInput" placeholder="Buscar serviço, peça ou observação...">
    </div>
    <button class="export-btn" id="exportBtn" title="Exportar histórico em CSV">⬇️</button>
  </div>

  <div class="filter-row" id="filterRow">
    <button class="filter-chip active" data-periodo="tudo">Tudo</button>
    <button class="filter-chip" data-periodo="6m">6 meses</button>
    <button class="filter-chip" data-periodo="ano">Este ano</button>
  </div>

  <div class="list" id="list"></div>

  <button class="fab" id="fabAdd">+</button>
</div>

<!-- Modal: novo/editar serviço -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <p class="modal-title" id="modalTitle">Novo serviço</p>
      <button class="close-btn" id="closeModal">✕</button>
    </div>
    <div class="modal-body">
      <button type="button" class="add-part-link" id="repeatLastBtn" style="display:none;">🔁 Repetir último serviço</button>

      <div class="field">
        <label>Veículo</label>
        <select id="fVeiculo"></select>
      </div>

      <div class="row-2">
        <div class="field">
          <label>Data</label>
          <input type="date" id="fData">
        </div>
        <div class="field">
          <label>Km</label>
          <input type="number" id="fKm" placeholder="ex: 93500">
        </div>
      </div>

      <div class="field">
        <label>Serviço realizado</label>
        <input type="text" id="fServico" placeholder="ex: Troca de óleo e filtro">
      </div>

      <div class="field">
        <label>Preço total (R$)</label>
        <input type="number" step="0.01" id="fPreco" placeholder="0.00">
      </div>

      <div class="parts-block">
        <div class="parts-block-title">Peças trocadas</div>
        <div id="partsRows"></div>
        <button type="button" class="add-part-link" id="addPartBtn">+ adicionar outra peça</button>
      </div>

      <div class="field">
        <label>Observações</label>
        <textarea rows="2" id="fObs" placeholder="ex: lembrete, marca do óleo..."></textarea>
      </div>

      <button class="save-btn" id="saveBtn">Salvar serviço</button>
    </div>
  </div>
</div>

<!-- Modal: editar veículo (marca/modelo/ano/placa/km) — substitui o antigo prompt() de km -->
<div class="modal-overlay" id="vehicleModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <p class="modal-title" id="vehicleModalTitle">Editar veículo</p>
      <button class="close-btn" id="closeVehicleModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="row-2">
        <div class="field">
          <label>Marca</label>
          <input type="text" id="fVeicMarca" placeholder="ex: Honda">
        </div>
        <div class="field">
          <label>Modelo</label>
          <input type="text" id="fVeicModelo" placeholder="ex: XR 250 Tornado">
        </div>
      </div>
      <div class="row-2">
        <div class="field">
          <label>Ano</label>
          <input type="number" id="fVeicAno" placeholder="ex: 2007" inputmode="numeric">
        </div>
        <div class="field">
          <label>Placa</label>
          <input type="text" id="fVeicPlaca" placeholder="ex: DXK-8974">
        </div>
      </div>
      <div class="field">
        <label>Km atual</label>
        <input type="number" id="fVeicKm" placeholder="ex: 94200" inputmode="numeric">
      </div>
      <button class="save-btn" id="saveVehicleBtn">Salvar veículo</button>
    </div>
  </div>
</div>

<!-- Modal: confirmação genérica (substitui confirm()) -->
<div class="modal-overlay" id="confirmModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <p class="modal-title" id="confirmModalTitle">Confirmar</p>
    </div>
    <div class="modal-body">
      <p id="confirmModalMessage" style="font-size:13.5px;color:var(--muted);line-height:1.5;margin:0;"></p>
      <div class="btn-row-2">
        <button class="btn-mini" id="confirmCancelBtn">Cancelar</button>
        <button class="btn-mini danger" id="confirmOkBtn">Apagar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: detalhes do serviço (abre ao clicar no card) -->
<div class="modal-overlay" id="detailModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <p class="modal-title" id="detailTitle">Serviço</p>
      <button class="close-btn" id="closeDetailModal">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURAÇÃO — preencha antes de usar
   Cole aqui a URL do seu Worker (Cloudflare), algo como:
   https://servicos-veiculos-api.SEU-USUARIO.workers.dev
   ============================================================ */
const API_BASE_URL = "https://servicos-veiculos-api.lucaslbrena-dev.workers.dev";

/* ============================================================ */

let veiculos = [];
let currentVeiculoId = null;
let servicos = [];
let editingServicoId = null;
let confirmResolve = null;
let pendingRequests = 0;
let filtroPeriodo = "tudo"; // "tudo" | "6m" | "ano"

function isConfigured() {
  return API_BASE_URL && API_BASE_URL.startsWith("http");
}

function setLoading(on) {
  document.getElementById("loadingBar").classList.toggle("active", on);
}

async function api(path, options = {}) {
  pendingRequests++;
  setLoading(true);
  try {
    const res = await fetch(API_BASE_URL + path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        ...(options.headers || {}),
      },
    });
    if (!res.ok) {
      const text = await res.text().catch(() => "");
      throw new Error(`Erro na API (${res.status}): ${text || res.statusText}`);
    }
    if (res.status === 204) return null;
    return res.json();
  } finally {
    pendingRequests--;
    if (pendingRequests <= 0) {
      pendingRequests = 0;
      setLoading(false);
    }
  }
}

function fmtMoeda(v) {
  if (v === null || v === undefined || v === "") return "—";
  return "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtKm(v) {
  if (v === null || v === undefined || v === "") return null;
  return Number(v).toLocaleString("pt-BR") + " km";
}

function fmtData(v) {
  if (!v) return null;
  const [y, m, d] = v.split("-");
  return `${d}/${m}/${y}`;
}

function normalizar(str) {
  return (str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}

let toastTimer = null;
function toast(msg, type = "info") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (type === "error" ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove("show");
  }, 3000);
}

/* ---------- Tema por veículo (carro/moto têm cor de destaque própria) ---------- */

function aplicarTemaVeiculo() {
  const v = veiculos.find((x) => x.id === currentVeiculoId);
  const root = document.documentElement;
  if (v && v.tipo === "moto") {
    root.style.setProperty("--accent", "var(--accent-moto)");
    root.style.setProperty("--accent-soft", "var(--accent-moto-soft)");
  } else {
    root.style.setProperty("--accent", "var(--accent-carro)");
    root.style.setProperty("--accent-soft", "var(--accent-carro-soft)");
  }
}

/* ---------- Carregamento ---------- */

async function loadVeiculos() {
  veiculos = await api("/veiculos");
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  veiculos.forEach((v) => {
    const btn = document.createElement("button");
    btn.className = "tab" + (v.id === currentVeiculoId ? " active" : "");
    btn.textContent = (v.tipo === "moto" ? "🏍️ " : "🚗 ") + v.nome;
    btn.onclick = () => selecionarVeiculo(v.id);
    tabsEl.appendChild(btn);
  });
  if (!currentVeiculoId && veiculos.length) {
    currentVeiculoId = veiculos[0].id;
  }
}

// Ordena por data (mais recente primeiro); serviços sem data vão pro fim.
// Em caso de empate, o de maior id (cadastrado por último) vem primeiro.
function ordenarServicos(lista) {
  return [...lista].sort((a, b) => {
    if (a.data && b.data) {
      if (a.data !== b.data) return a.data < b.data ? 1 : -1;
    } else if (a.data && !b.data) {
      return -1;
    } else if (!a.data && b.data) {
      return 1;
    }
    return (b.id || 0) - (a.id || 0);
  });
}

async function loadServicos() {
  if (!currentVeiculoId) return;
  const dados = await api(`/servicos?veiculo_id=${currentVeiculoId}`);
  servicos = ordenarServicos(dados);
}

async function selecionarVeiculo(id) {
  currentVeiculoId = id;
  aplicarTemaVeiculo();
  await loadServicos();
  renderTabsActive();
  renderVehicleInfo();
  renderSummary();
  renderLembrete();
  renderChart();
  renderList();
}

function renderTabsActive() {
  document.querySelectorAll(".tab").forEach((btn, idx) => {
    btn.classList.toggle("active", veiculos[idx].id === currentVeiculoId);
  });
}

// Linha com marca/modelo/ano/placa do veículo selecionado, logo abaixo das
// abas. Se algum desses dados ainda não foi preenchido, mostra um convite
// pra completar em vez de deixar a linha em branco.
function renderVehicleInfo() {
  const v = veiculos.find((x) => x.id === currentVeiculoId);
  const el = document.getElementById("vehicleInfo");
  if (!v) {
    el.innerHTML = "";
    return;
  }

  const partes = [];
  const marcaModelo = [v.marca, v.modelo].filter(Boolean).join(" ");
  if (marcaModelo) partes.push(escapeHtml(marcaModelo));
  if (v.ano) partes.push(`Ano ${v.ano}`);
  if (v.placa) partes.push(escapeHtml(v.placa));

  el.innerHTML = partes.length
    ? `<span>${partes.join(" · ")}</span><button class="edit-km-btn" onclick="abrirEdicaoVeiculo()" title="Editar veículo">✏️</button>`
    : `<button class="add-part-link" onclick="abrirEdicaoVeiculo()">+ preencher marca, modelo, ano e placa</button>`;
}

/* ---------- Editar veículo: marca/modelo/ano/placa/km (modal, sem prompt()) ---------- */

function abrirEdicaoVeiculo() {
  const v = veiculos.find((x) => x.id === currentVeiculoId);
  if (!v) return;
  document.getElementById("vehicleModalTitle").textContent = `Editar ${v.nome}`;
  document.getElementById("fVeicMarca").value = v.marca || "";
  document.getElementById("fVeicModelo").value = v.modelo || "";
  document.getElementById("fVeicAno").value = v.ano ?? "";
  document.getElementById("fVeicPlaca").value = v.placa || "";
  document.getElementById("fVeicKm").value = v.km ?? "";
  document.getElementById("vehicleModalOverlay").classList.add("open");
}

function fecharVeiculoModal() {
  document.getElementById("vehicleModalOverlay").classList.remove("open");
}

async function salvarVeiculo() {
  const v = veiculos.find((x) => x.id === currentVeiculoId);
  if (!v) return;

  const marca = document.getElementById("fVeicMarca").value.trim();
  const modelo = document.getElementById("fVeicModelo").value.trim();
  const anoRaw = document.getElementById("fVeicAno").value;
  const placa = document.getElementById("fVeicPlaca").value.trim();
  const kmRaw = document.getElementById("fVeicKm").value;

  const kmNum = Number(kmRaw);
  if (!kmRaw.trim() || isNaN(kmNum) || kmNum < 0) {
    toast("Km inválido. Digite só números.", "error");
    return;
  }
  const ano = anoRaw.trim() ? Number(anoRaw) : null;

  const saveBtn = document.getElementById("saveVehicleBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Salvando...";

  try {
    const atualizado = await api(`/veiculos/${v.id}`, {
      method: "PATCH",
      body: JSON.stringify({ marca, modelo, ano, placa, km: kmNum }),
    });
    Object.assign(v, atualizado);
    renderVehicleInfo();
    renderSummary();
    renderLembrete();
    fecharVeiculoModal();
    toast("Veículo atualizado!");
  } catch (err) {
    toast("Não foi possível atualizar o veículo: " + err.message, "error");
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Salvar veículo";
  }
}

function confirmDialog(message, opts = {}) {

  document.getElementById("confirmModalMessage").textContent = message;

/* ---------- Alerta de troca de óleo (regra fixa, não estimativa) ----------
   Diferente do lembrete genérico abaixo (que projeta a partir da média do
   seu próprio histórico), esse usa um intervalo fixo típico de fabricante:
   carro a cada 10.000 km ou 1 ano; moto a cada 1.500 km ou 6 meses — vale o
   que vencer primeiro. Olha a troca de óleo mais recente (qualquer serviço
   com "óleo" no nome) e compara com o km/data atuais. Se não houver
   nenhuma troca de óleo registrada ainda, não há base pra alertar nada —
   o card some nesse caso. */
const REGRA_TROCA_OLEO = {
  carro: { km: 10000, meses: 12 },
  moto: { km: 1500, meses: 6 },
};

function mesesEntre(dataIso, hoje) {
  const ini = new Date(dataIso + "T00:00:00");
  let meses = (hoje.getFullYear() - ini.getFullYear()) * 12 + (hoje.getMonth() - ini.getMonth());
  if (hoje.getDate() < ini.getDate()) meses -= 1;
  return Math.max(meses, 0);
}

function getAlertaOleo() {
  const v = veiculos.find((x) => x.id === currentVeiculoId);
  if (!v) return null;
  const regra = REGRA_TROCA_OLEO[v.tipo] || REGRA_TROCA_OLEO.carro;

  const trocas = servicos
    .filter((s) => normalizar(s.servico_realizado).includes("oleo") && (s.km || s.data))
    .sort((a, b) => {
      if (a.data && b.data) return a.data < b.data ? -1 : 1;
      if (a.data && !b.data) return -1;
      if (!a.data && b.data) return 1;
      return (a.km || 0) - (b.km || 0);
    });
  const ultima = trocas[trocas.length - 1];
  if (!ultima) return null;

  const kmFaltam = v.km && ultima.km ? regra.km - (v.km - ultima.km) : null;
  const mesesFaltam = ultima.data ? regra.meses - mesesEntre(ultima.data, new Date()) : null;
  if (kmFaltam === null && mesesFaltam === null) return null;

  const atrasado = (kmFaltam !== null && kmFaltam <= 0) || (mesesFaltam !== null && mesesFaltam <= 0);
  const perto =
    !atrasado &&
    ((kmFaltam !== null && kmFaltam <= regra.km * 0.15) || (mesesFaltam !== null && mesesFaltam <= 1));

  return { regra, kmFaltam, mesesFaltam, atrasado, perto };
}

function renderAlertaOleo(info) {
  const cls = info.atrasado ? "lembrete-danger" : info.perto ? "lembrete-warn" : "lembrete-ok";
  let texto;
  if (info.atrasado) {
    const motivos = [];
    if (info.kmFaltam !== null && info.kmFaltam <= 0) motivos.push(`${fmtKm(Math.abs(info.kmFaltam))} além do limite de km`);
    if (info.mesesFaltam !== null && info.mesesFaltam <= 0) {
      const m = Math.abs(info.mesesFaltam);
      motivos.push(`${m} ${m === 1 ? "mês" : "meses"} além do prazo`);
    }
    texto = `Troca de óleo atrasada — ${motivos.join(" e ")}.`;
  } else {
    const partes = [];
    if (info.kmFaltam !== null) partes.push(fmtKm(info.kmFaltam));
    if (info.mesesFaltam !== null) {
      const m = info.mesesFaltam;
      partes.push(`${m} ${m === 1 ? "mês" : "meses"}`);
    }
    texto = `Próxima troca de óleo em até ${partes.join(" ou ")} (o que vencer primeiro).`;
  }
  return `<div class="lembrete-item ${cls}"><span class="lembrete-icon">🛢️</span><span>${texto}</span></div>`;
}

/* ---------- Lembretes genéricos de manutenção ----------
   Pra qualquer OUTRO serviço que se repete no histórico (não óleo, que já
   tem o alerta de regra fixa acima): agrupa por palavra-chave em comum no
   nome — não exige o texto idêntico, senão "Troca de pastilha" e "Pastilha
   de freio dianteira" cairiam em grupos diferentes. Ignora palavras muito
   genéricas (conectivos e o verbo "troca/trocar", que aparece em quase
   todo serviço e juntaria coisas sem relação). Pra cada grupo com 2+
   ocorrências com km preenchido, calcula o intervalo médio de km entre
   elas e projeta quando a próxima deve acontecer a partir do km atual do
   veículo. Cadastrar os serviços recorrentes com nomes parecidos (o botão
   "repetir último serviço" ajuda nisso) deixa a previsão mais confiável. */
const PALAVRAS_GENERICAS = new Set([
  "de", "da", "do", "das", "dos", "e", "o", "a", "os", "as", "em", "no", "na",
  "pra", "para", "com", "um", "uma", "troca", "trocar", "troquei", "oleo",
]);

function palavrasChave(nome) {
  return normalizar(nome)
    .split(/[^a-z0-9]+/)
    .filter((t) => t.length >= 3 && !PALAVRAS_GENERICAS.has(t));
}

function agruparServicosRecorrentes() {
  const grupos = []; // [{ palavras: Set, itens: [...] }]
  servicos.forEach((s) => {
    if (!s.km || !s.servico_realizado) return;
    if (normalizar(s.servico_realizado).includes("oleo")) return; // já coberto pelo alerta de óleo
    const palavras = new Set(palavrasChave(s.servico_realizado));
    if (!palavras.size) return; // nome só com palavras genéricas — não dá pra agrupar com segurança

    const grupo = grupos.find((g) => [...g.palavras].some((p) => palavras.has(p)));
    if (grupo) {
      palavras.forEach((p) => grupo.palavras.add(p));
      grupo.itens.push(s);
    } else {
      grupos.push({ palavras, itens: [s] });
    }
  });
  return grupos;
}

function getLembretesGenericos() {
  const v = veiculos.find((x) => x.id === currentVeiculoId);
  if (!v || !v.km) return [];

  const lembretes = [];
  agruparServicosRecorrentes().forEach((g) => {
    if (g.itens.length < 2) return;
    const ordenado = [...g.itens].sort((a, b) => (a.km || 0) - (b.km || 0));
    const intervalos = [];
    for (let i = 1; i < ordenado.length; i++) {
      const delta = ordenado[i].km - ordenado[i - 1].km;
      if (delta > 0) intervalos.push(delta);
    }
    if (!intervalos.length) return;

    const media = intervalos.reduce((a, b) => a + b, 0) / intervalos.length;
    const ultima = ordenado[ordenado.length - 1];
    const previsto = ultima.km + media;
    const faltam = previsto - v.km;
    lembretes.push({ nome: ultima.servico_realizado, previsto: Math.round(previsto), faltam: Math.round(faltam) });
  });

  lembretes.sort((a, b) => a.faltam - b.faltam);
  return lembretes;
}

function renderLembreteGenerico(info) {
  const atrasado = info.faltam <= 0;
  const perto = info.faltam > 0 && info.faltam <= 500;
  const cls = atrasado ? "lembrete-danger" : perto ? "lembrete-warn" : "lembrete-ok";
  const texto = atrasado
    ? `${escapeHtml(info.nome)}: provavelmente atrasado em ${fmtKm(Math.abs(info.faltam))}`
    : `${escapeHtml(info.nome)}: previsto para ~${fmtKm(info.previsto)} (faltam ${fmtKm(info.faltam)})`;
  return `<div class="lembrete-item ${cls}"><span class="lembrete-icon">🔧</span><span>${texto}</span></div>`;
}

// Junta o alerta de óleo (regra fixa) com até 1 lembrete genérico mais
// urgente, pra não poluir a tela com muitos cards.
function renderLembrete() {
  const el = document.getElementById("lembreteWrap");
  const cards = [];

  const alertaOleo = getAlertaOleo();
  if (alertaOleo) cards.push(renderAlertaOleo(alertaOleo));

  const genericos = getLembretesGenericos().slice(0, 2 - cards.length);
  genericos.forEach((info) => cards.push(renderLembreteGenerico(info)));

  if (!cards.length) {
    el.style.display = "none";
    el.innerHTML = "";
    return;
  }

  el.style.display = "flex";
  el.innerHTML = cards.join("");
}

/* ---------- Gráfico de gasto por mês (sem lib, barras em CSS) ---------- */

const MESES_ABREV = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

function renderChart() {
  const wrap = document.getElementById("chartWrap");
  const porMes = {};
  servicos.forEach((s) => {
    if (!s.data) return;
    const mes = s.data.slice(0, 7); // "AAAA-MM"
    porMes[mes] = (porMes[mes] || 0) + (Number(s.preco) || 0);
  });

  const meses = Object.keys(porMes).sort();
  if (meses.length < 2) {
    wrap.style.display = "none";
    wrap.innerHTML = "";
    return;
  }

  const ultimos = meses.slice(-6);
  const valores = ultimos.map((m) => porMes[m]);
  const max = Math.max(...valores, 1);

  const cols = ultimos
    .map((m, i) => {
      const v = valores[i];
      const h = Math.max((v / max) * 100, 4);
      const mo = Number(m.split("-")[1]);
      return `
        <div class="chart-col">
          <div class="chart-value">${v > 0 ? fmtMoeda(v).replace("R$ ", "") : ""}</div>
          <div class="chart-bar-wrap"><div class="chart-bar" style="height:${h}%"></div></div>
          <div class="chart-label">${MESES_ABREV[mo - 1]}</div>
        </div>`;
    })
    .join("");

  wrap.style.display = "block";
  wrap.innerHTML = `<div class="chart-title">Gasto por mês</div><div class="chart-bars">${cols}</div>`;
}

function renderSkeleton() {
  document.getElementById("list").innerHTML = Array.from({ length: 3 })
    .map(() => `<div class="skeleton-card"></div>`)
    .join("");
}

// Filtro por período: "tudo" mostra tudo; "6m"/"ano" exigem data preenchida
// (serviço sem data não tem como saber se cai no período, então some do
// filtro — mas continua contando nos totais do resumo).
function passaFiltroPeriodo(s) {
  if (filtroPeriodo === "tudo") return true;
  if (!s.data) return false;
  const hoje = new Date();
  const dataServico = new Date(s.data + "T00:00:00");
  if (filtroPeriodo === "6m") {
    const limite = new Date(hoje);
    limite.setMonth(limite.getMonth() - 6);
    return dataServico >= limite;
  }
  if (filtroPeriodo === "ano") {
    return dataServico.getFullYear() === hoje.getFullYear();
  }
  return true;
}

function renderList() {
  const term = normalizar(document.getElementById("searchInput").value.trim());
  const el = document.getElementById("list");

  const filtrados = servicos.filter((s) => {
    if (!passaFiltroPeriodo(s)) return false;
    if (!term) return true;
    const pecasStr = (s.pecas_trocadas || []).map((p) => p.nome_peca).join(" ");
    return (
      normalizar(s.servico_realizado).includes(term) ||
      normalizar(s.observacoes || "").includes(term) ||
      normalizar(pecasStr).includes(term)
    );
  });

  if (!filtrados.length) {
    el.innerHTML = `<div class="empty-state">Nenhum serviço encontrado${filtroPeriodo !== "tudo" ? " nesse período" : ""}.</div>`;
    return;
  }

  el.innerHTML = filtrados
    .map((s) => {
      const semData = !s.data ? `<span class="badge-warn">sem data</span>` : "";
      const semKm = !s.km ? `<span class="badge-warn">sem km</span>` : "";
      const metaParts = [fmtData(s.data), fmtKm(s.km)].filter(Boolean).join(" · ");
      const pecas = (s.pecas_trocadas || []).map((p) => p.nome_peca).join(", ");
      return `
        <div class="card" onclick="abrirDetalhe(${s.id})">
          <div class="card-top">
            <div>
              <p class="card-service">${escapeHtml(s.servico_realizado)}${semData}${semKm}</p>
              <div class="card-meta">${metaParts || "—"}</div>
            </div>
            <div class="card-price">${fmtMoeda(s.preco)}</div>
          </div>
          ${pecas ? `<div class="card-parts">🔧 ${escapeHtml(pecas)}</div>` : ""}
          ${s.observacoes ? `<div class="card-obs">${escapeHtml(s.observacoes)}</div>` : ""}
        </div>
      `;
    })
    .join("");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

/* ---------- Exportar histórico em CSV ---------- */

function csvEscape(valor) {
  const str = String(valor ?? "");
  if (/["\n,;]/.test(str)) {
    return '"' + str.replace(/"/g, '""') + '"';
  }
  return str;
}

function exportarCsv() {
  if (!servicos.length) {
    toast("Não há serviços pra exportar nesse veículo.", "error");
    return;
  }
  const v = veiculos.find((x) => x.id === currentVeiculoId);

  const linhas = [["Data", "Km", "Serviço", "Preço total (R$)", "Peças trocadas", "Preço das peças (R$)", "Observações"]];
  servicos.forEach((s) => {
    const pecas = s.pecas_trocadas || [];
    linhas.push([
      fmtData(s.data) || "",
      s.km ?? "",
      s.servico_realizado,
      s.preco ?? "",
      pecas.map((p) => p.nome_peca).join("; "),
      pecas.map((p) => (p.preco ?? "")).join("; "),
      s.observacoes || "",
    ]);
  });

  const csv = linhas.map((linha) => linha.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const nomeArquivo = `servicos_${(v ? v.nome : "veiculo").toLowerCase().replace(/\s+/g, "_")}_${new Date().toISOString().slice(0, 10)}.csv`;

  const a = document.createElement("a");
  a.href = url;
  a.download = nomeArquivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

        <div class="detail-label">Data</div>
        <div class="detail-value">${fmtData(s.data) || "—"}</div>

      <div>
        <div class="detail-label">Km no serviço</div>
        <div class="detail-value">${fmtKm(s.km) || "—"}</div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-label">Peças trocadas</div>
      ${pecasHtml}
    </div>

    ${
      s.observacoes
        ? `<div class="detail-section">
             <div class="detail-label">Observações</div>
             <div class="detail-obs">${escapeHtml(s.observacoes)}</div>
           </div>`

    }

    <div class="btn-row-2">

/* ---------- Modal / Formulário ---------- */

function preencherSelectVeiculos() {
  const sel = document.getElementById("fVeiculo");
  sel.innerHTML = veiculos
    .map((v) => `<option value="${v.id}">${(v.tipo === "moto" ? "🏍️ " : "🚗 ")}${escapeHtml(v.nome)}</option>`)
    .join("");
}

function novaLinhaPeca(nome = "", preco = "") {
  const row = document.createElement("div");
  row.className = "part-row";
  row.innerHTML = `
    <input type="text" class="part-nome" placeholder="Nome da peça" value="${escapeHtml(nome)}">
    <input type="number" step="0.01" class="part-preco" placeholder="R$" value="${preco ?? ""}">
    <button type="button" class="remove-part" title="Remover">✕</button>
  `;
  row.querySelector(".remove-part").onclick = () => row.remove();
  document.getElementById("partsRows").appendChild(row);
}

function abrirModal() {
  document.getElementById("modalOverlay").classList.add("open");
}
function fecharModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}

function limparFormulario() {
  editingServicoId = null;
  document.getElementById("modalTitle").textContent = "Novo serviço";
  preencherSelectVeiculos();
  document.getElementById("fVeiculo").value = currentVeiculoId;
  document.getElementById("fData").value = "";
  document.getElementById("fKm").value = "";
  document.getElementById("fServico").value = "";
  document.getElementById("fPreco").value = "";
  document.getElementById("fObs").value = "";
  document.getElementById("partsRows").innerHTML = "";
  novaLinhaPeca();
  // só faz sentido oferecer "repetir último" quando há um serviço anterior
  // pra copiar, cadastrando um novo (não ao editar um já existente)
  document.getElementById("repeatLastBtn").style.display = servicos.length ? "block" : "none";
}

function abrirNovoServico() {
  limparFormulario();
  abrirModal();
}

// Pré-preenche o formulário com os dados do último serviço cadastrado do
// veículo atual (nome, preço, peças, observações) — data e km ficam em
// branco de propósito, já que são a parte que sempre muda. Também ajuda os
// lembretes de manutenção a funcionar melhor: nomes repetidos com o texto
// idêntico são o que a heurística usa pra agrupar o histórico.
function repetirUltimoServico() {
  const ultimo = servicos[0];
  if (!ultimo) return;

  document.getElementById("fServico").value = ultimo.servico_realizado;
  document.getElementById("fPreco").value = ultimo.preco ?? "";
  document.getElementById("fObs").value = ultimo.observacoes || "";
  document.getElementById("partsRows").innerHTML = "";
  const pecas = ultimo.pecas_trocadas || [];
  if (pecas.length) {
    pecas.forEach((p) => novaLinhaPeca(p.nome_peca, p.preco));
  } else {
    novaLinhaPeca();
  }
  toast("Preenchido com o último serviço — ajuste data, km e valores.");
}

function abrirEdicao(servicoId) {
  const s = servicos.find((x) => x.id === servicoId);
  if (!s) return;
  editingServicoId = servicoId;
  document.getElementById("modalTitle").textContent = "Editar serviço";
  document.getElementById("repeatLastBtn").style.display = "none";
  preencherSelectVeiculos();
  document.getElementById("fVeiculo").value = s.veiculo_id;
  document.getElementById("fData").value = s.data || "";
  document.getElementById("fKm").value = s.km ?? "";
  document.getElementById("fServico").value = s.servico_realizado;
  document.getElementById("fPreco").value = s.preco ?? "";
  document.getElementById("fObs").value = s.observacoes || "";
  document.getElementById("partsRows").innerHTML = "";
  const pecas = s.pecas_trocadas || [];
  if (pecas.length) {
    pecas.forEach((p) => novaLinhaPeca(p.nome_peca, p.preco));
  } else {
    novaLinhaPeca();
  }
  abrirModal();
}

async function salvarServico() {
  const veiculoId = Number(document.getElementById("fVeiculo").value);
  const data = document.getElementById("fData").value || null;
  const km = document.getElementById("fKm").value ? Number(document.getElementById("fKm").value) : null;
  const servicoRealizado = document.getElementById("fServico").value.trim();
  const preco = document.getElementById("fPreco").value ? Number(document.getElementById("fPreco").value) : null;
  const observacoes = document.getElementById("fObs").value.trim() || null;

  if (!servicoRealizado) {
    toast("Preencha o nome do serviço realizado.", "error");
    return;
  }

  // Validação de km decrescente: só temos os serviços já carregados do
  // veículo selecionado na aba atual (`servicos`), então essa checagem só
  // roda quando o formulário está no mesmo veículo da aba — evita comparar
  // com dados que não estão em memória.
  if (km !== null && veiculoId === currentVeiculoId) {
    const maiorKmHistorico = servicos
      .filter((s) => s.id !== editingServicoId && s.km)
      .reduce((max, s) => Math.max(max, s.km), 0);
    if (maiorKmHistorico > 0 && km < maiorKmHistorico) {
      const seguir = await confirmDialog(
        `Esse km (${fmtKm(km)}) é menor que o maior km já registrado nesse veículo (${fmtKm(maiorKmHistorico)}). Confere?`,
        { title: "Km parece incorreto", okText: "Salvar assim mesmo" }
      );
      if (!seguir) return;
    }
  }

  const pecas = Array.from(document.querySelectorAll("#partsRows .part-row"))
    .map((row) => ({
      nome_peca: row.querySelector(".part-nome").value.trim(),
      preco: row.querySelector(".part-preco").value ? Number(row.querySelector(".part-preco").value) : null,
    }))
    .filter((p) => p.nome_peca);

  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Salvando...";

  try {
    let servicoId = editingServicoId;

    if (editingServicoId) {
      await api(`/servicos/${editingServicoId}`, {
        method: "PATCH",
        body: JSON.stringify({ veiculo_id: veiculoId, data, km, servico_realizado: servicoRealizado, preco, observacoes }),
      });
      // remove peças antigas e insere as atuais (mais simples que fazer diff)
      await api(`/pecas?servico_id=${editingServicoId}`, { method: "DELETE" });
    } else {
      const criado = await api("/servicos", {
        method: "POST",
        body: JSON.stringify({ veiculo_id: veiculoId, data, km, servico_realizado: servicoRealizado, preco, observacoes }),
      });
      servicoId = criado.id;
    }

    if (pecas.length) {
      await api("/pecas", {
        method: "POST",
        body: JSON.stringify(pecas.map((p) => ({ ...p, servico_id: servicoId }))),
      });
    }

    fecharModal();
    await selecionarVeiculo(veiculoId);
    toast(editingServicoId ? "Serviço atualizado!" : "Serviço salvo!");
  } catch (err) {
    toast("Não foi possível salvar: " + err.message, "error");
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Salvar serviço";
  }
}

async function apagarServico(servicoId) {
  const ok = await confirmDialog("Apagar este serviço? Essa ação não pode ser desfeita.", {
    title: "Apagar serviço",
    okText: "Apagar",
  });
  if (!ok) return;

  try {
    await api(`/servicos/${servicoId}`, { method: "DELETE" });
    await loadServicos();
    renderSummary();
    renderLembrete();
    renderChart();
    renderList();
    toast("Serviço apagado.");
  } catch (err) {
    toast("Não foi possível apagar: " + err.message, "error");
  }
}

/* ---------- Eventos ---------- */

document.getElementById("fabAdd").onclick = abrirNovoServico;
document.getElementById("closeModal").onclick = fecharModal;
document.getElementById("modalOverlay").onclick = (e) => {
  if (e.target.id === "modalOverlay") fecharModal();
};
document.getElementById("addPartBtn").onclick = () => novaLinhaPeca();
document.getElementById("saveBtn").onclick = salvarServico;
document.getElementById("searchInput").oninput = renderList;
document.getElementById("repeatLastBtn").onclick = repetirUltimoServico;

document.getElementById("exportBtn").onclick = exportarCsv;

document.querySelectorAll(".filter-chip").forEach((btn) => {
  btn.onclick = () => {
    filtroPeriodo = btn.dataset.periodo;
    document.querySelectorAll(".filter-chip").forEach((b) => b.classList.toggle("active", b === btn));
    renderList();
  };
});

document.getElementById("closeVehicleModal").onclick = fecharVeiculoModal;
document.getElementById("vehicleModalOverlay").onclick = (e) => {
  if (e.target.id === "vehicleModalOverlay") fecharVeiculoModal();
};
document.getElementById("saveVehicleBtn").onclick = salvarVeiculo;

document.getElementById("confirmCancelBtn").onclick = () => closeConfirmDialog(false);
document.getElementById("confirmOkBtn").onclick = () => closeConfirmDialog(true);
document.getElementById("confirmModalOverlay").onclick = (e) => {
  if (e.target.id === "confirmModalOverlay") closeConfirmDialog(false);
};

document.getElementById("closeDetailModal").onclick = fecharDetalhe;
document.getElementById("detailModalOverlay").onclick = (e) => {
  if (e.target.id === "detailModalOverlay") fecharDetalhe();
};

/* ---------- Início ---------- */

async function init() {
  if (!isConfigured()) {
    document.getElementById("configWarning").style.display = "block";
    return;
  }
  renderSkeleton();
  try {
    await loadVeiculos();
    aplicarTemaVeiculo();
    await selecionarVeiculo(currentVeiculoId);
  } catch (err) {
    document.getElementById("list").innerHTML =
      `<div class="empty-state">Erro ao carregar dados: ${escapeHtml(err.message)}</div>`;
  }
}

init();
</script>
